const SANS = LANG === 'en' ? '"Inter","Noto Sans SC",sans-serif' : '"Noto Sans SC","WenQuanYi Zen Hei",sans-serif';

const font = (size, weight = 700, mono = false) => `${weight} ${size}px ${mono ? MONO : SANS}`;
/* 文字太宽时按比例缩小字号：居中的文字最宽 860，左对齐的文字不超过 x=944 */
const shrink = (f, k) => f.replace(/(\d+(?:\.\d+)?)px/, (m, n) => `${Math.floor(n * k * 10) / 10}px`);
const limitOf = (x, align, max) => max || (align === 'center' ? 860 : 944 - x);

function fill(color, path) { ctx.fillStyle = color; ctx.beginPath(); path(); ctx.fill(); }
function textW(str, f, ls = 0) { ctx.save(); ctx.font = f; ctx.letterSpacing = ls + 'px'; const w = ctx.measureText(str).width; ctx.restore(); return w; }

/* 一行文字，可以分段上色 */
function line(segs, x, y, f, { color = C.ink, align = 'left', alpha = 1, ls = 0, max = 0 } = {}) {
  if (alpha <= 0) return;
  segs = segsOf(segs, color);
  ctx.save();
  ctx.font = f; ctx.letterSpacing = ls + 'px'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let ws = segs.map(s => ctx.measureText(s[0]).width), total = ws.reduce((a, b) => a + b, 0);
  const lim = limitOf(x, align, max);
  if (total > lim) { ctx.font = shrink(f, lim / total); ws = segs.map(s => ctx.measureText(s[0]).width); total = ws.reduce((a, b) => a + b, 0); }
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  ctx.globalAlpha = alpha;
  segs.forEach((s, i) => { ctx.fillStyle = s[1]; ctx.fillText(s[0], cx, y); cx += ws[i]; });
  ctx.restore();
}
/* 逐字出现的标题 */
function reveal(segs, x, y, f, t, t0, { color = C.ink, align = 'left', alpha = 1, stagger = .032, dur = .45, rise = 30, ls = 0, max = 0 } = {}) {
  if (alpha <= 0 || t < t0) return;
  const chars = [];
  segsOf(segs, color).forEach(([s, c]) => [...s].forEach(ch => chars.push([ch, c])));
  if (LANG === 'en') stagger = Math.min(stagger, .6 / chars.length + .004);
  ctx.save();
  ctx.font = f; ctx.letterSpacing = ls + 'px'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const whole = segsOf(segs, color).map(s => s[0]).join('');
  const lim = limitOf(x, align, max), wide = ctx.measureText(whole).width;
  if (wide > lim) ctx.font = shrink(f, lim / wide);
  // 按整段文字的宽度逐字排开（保留字距），再逐字出现
  const ws = chars.map(([ch], i) => ctx.measureText(chars.slice(0, i + 1).map(c => c[0]).join('')).width - (i ? ctx.measureText(chars.slice(0, i).map(c => c[0]).join('')).width : 0)), total = ws.reduce((a, b) => a + b, 0);
  let cx = align === 'center' ? x - total / 2 : x;
  chars.forEach(([ch, c], i) => {
    const k = Ez.out(prog(t, t0 + i * stagger, t0 + i * stagger + dur));
    if (k > 0) { ctx.globalAlpha = alpha * k; ctx.fillStyle = c; ctx.fillText(ch, cx, y + (1 - k) * rise); }
    cx += ws[i];

}

    line(ln, W / 2, y0 + i * lh + (1 - k) * 16, font(size, weight), { color, align: 'center', alpha: v * k });

    TX.motto.forEach(([s, c, y], i) => reveal(s, W / 2, y, font(92, 900), t, 81.0 + (c === C.humanLt ? .8 : 0) + (i % 2 && TX.motto.length > 2 ? .25 : 0), { color: c, alpha: mv, align: 'center', stagger: .05 }));
  }
  const ev = vis(t, 84.2, DUR + 5, .6, .1);
  if (!ev) return;
  const S = TX.endShift;
  TX.ask.forEach((s, i) => reveal(s, W / 2, 360 - (TX.ask.length - 1) * 50 + i * 100, font(84, 900), t, 84.3 + i * .3, { alpha: ev, align: 'center', stagger: .04 }));
  const k = Ez.out(prog(t, 85.3, 85.9));
  line(TX.endLines[0], W / 2, 1010 + S, font(44, 700), { alpha: ev * k, align: 'center' });
  line(TX.endLines[1], W / 2, 1076 + S, font(44, 700), { color: C.humanLt, alpha: ev * k, align: 'center' });
  const uk = Ez.back(prog(t, 85.9, 86.5));
  if (uk > 0) {
    const url = TX.url, f = font(34, 700, true), w = textW(url, f) + 80;
    ctx.save(); ctx.globalAlpha = ev * clamp(uk); ctx.translate(W / 2, 1200 + S); ctx.scale(clamp(uk, 0, 1.2), clamp(uk, 0, 1.2));
    ctx.shadowColor = rgba(C.ai, .7); ctx.shadowBlur = 30;
    pill(-w / 2, -44, w, 88, C.ai);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = f; ctx.textAlign = 'center'; ctx.fillText(url, 0, 12);
    ctx.restore();
  }
  const bk = Ez.out(prog(t, 86.4, 87.0));
  const bw = textW(TX.brand, font(34, 900)), bx = W / 2 - (bw + 58) / 2;
  rings(bx + 20, 1330 + S, 20, ev * bk);
  line(TX.brand, bx + 58, 1342 + S, font(34, 900), { alpha: ev * bk });
}

/* ---------- 一帧 ---------- */
function seek(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.shadowBlur = 0; ctx.setLineDash([]); ctx.letterSpacing = '0px';
  sky(t);
  const b = bAt(t);
  const f = fxAt(t);
  if (t > 84) f.garden = Ez.out(prog(t, 84.6, 85.4));
  building({ ...b, t, lv: levelAt(t), fx: f, hl: hlAt(t) });
  rail(t);
  s0(t); s1(t); s2(t); s3(t); s4(t); s5(t); s6(t); s7(t); s8(t); s9(t);
  chapterTag(t);
  const wm = vis(t, 5.6, 83.9, .8, .6) * .5;
  if (wm) {
    const mark = `${TX.brand} · ${TX.url}`, mw = textW(mark, font(24, 700)), mx = W / 2 - (mw + 24) / 2;
    rings(mx + 9, 1668, 9, wm); line(mark, mx + 24, 1677, font(24, 700), { color: C.dim, alpha: wm });
  }
  // 开头结尾的淡入淡出
  const fade = Math.max(1 - prog(t, 0, .25), prog(t, DUR - .9, DUR));
  if (fade > 0 && t > 1) { ctx.globalAlpha = fade; ctx.fillStyle = '#05080f'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}
function hlAt(t) {
  // 讲到“小周和阿敏”时，把他们两家圈出来
  const k = vis(t, 36.0, 36.9, .2, .5);
  if (!k) return null;
  const h = new Array(12).fill(0); h[2] = k; h[6] = k;
  return h;
}

/* ---------- 声音：离线合成 ---------- */
const SR = 48000, CH = 2 * 1024 * 1024;
async function renderAudio() {
  const ac = new OfflineAudioContext(2, Math.ceil((DUR + .5) * SR), SR);
  const R = rng(99);
  const master = ac.createGain(); master.gain.value = .9;
  const comp = ac.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3; comp.attack.value = .01; comp.release.value = .3;
  master.connect(comp); comp.connect(ac.destination);
  const verb = ac.createConvolver();
  const ir = ac.createBuffer(2, SR * 3.2, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (R() * 2 - 1) * Math.pow(1 - i / d.length, 3.2); }
  verb.buffer = ir; verb.connect(master);
  const bus = (dry, wet) => { const g = ac.createGain(); g.gain.value = dry; g.connect(master); const s = ac.createGain(); s.gain.value = wet; g.connect(s); s.connect(verb); return g; };
  const padBus = bus(1.1, .8), sfxBus = bus(.8, .16), bellBus = bus(1.0, .7);
  const noise = ac.createBuffer(1, SR * 2, SR); { const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = R() * 2 - 1; }
  const nf = m => 440 * Math.pow(2, (m - 69) / 12);
  const pan = (node, p, dest) => { const pn = ac.createStereoPanner(); pn.pan.value = p; node.connect(pn); pn.connect(dest); };

  function pad(m, t0, t1, g = .02, p = 0, cut = 1000) {
    const out = ac.createGain();
    out.gain.setValueAtTime(0, t0); out.gain.linearRampToValueAtTime(g, t0 + 1.2);
    out.gain.setValueAtTime(g, Math.max(t0 + 1.2, t1)); out.gain.linearRampToValueAtTime(0, Math.max(t0 + 1.2, t1) + 2.0);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cut; lp.Q.value = .5;
    lp.connect(out); pan(out, p, padBus);
    [['sawtooth', 1.004, .45], ['sawtooth', .996, .45], ['triangle', .5, .7], ['sine', 1, .5]].forEach(([type, mul, amp]) => {
      const o = ac.createOscillator(); o.type = type; o.frequency.value = nf(m) * mul;
      const og = ac.createGain(); og.gain.value = amp; o.connect(og); og.connect(lp);

  }
  const chord = (ms, t0, t1, g = .016, cut = 1000) => ms.forEach((m, i) => pad(m, t0, t1, g, (i / Math.max(1, ms.length - 1) - .5) * .7, cut));
  function bell(m, t, g = .05, dec = 1.8, p = 0, ratio = 3.5, idx = 1.2) {
    const f = nf(m);
    const car = ac.createOscillator(); car.frequency.value = f;
    const mod = ac.createOscillator(); mod.frequency.value = f * ratio;
    const mg = ac.createGain(); mg.gain.setValueAtTime(f * idx, t); mg.gain.exponentialRampToValueAtTime(f * .01, t + dec * .7);
    mod.connect(mg); mg.connect(car.frequency);
    const env = ac.createGain(); env.gain.setValueAtTime(.0001, t); env.gain.exponentialRampToValueAtTime(g, t + .008); env.gain.exponentialRampToValueAtTime(.0001, t + dec);
    car.connect(env); pan(env, p, bellBus);
    car.start(t); mod.start(t); car.stop(t + dec + .1); mod.stop(t + dec + .1);
  }
  const pluck = (m, t, g = .06, p = 0) => bell(m, t, g, 1.4, p, 2, .5);
  function tick(f, t, g = .012, dec = .05, p = 0) {
    const o = ac.createOscillator(); o.frequency.value = f;
    const env = ac.createGain(); env.gain.setValueAtTime(.0001, t); env.gain.exponentialRampToValueAtTime(g, t + .003); env.gain.exponentialRampToValueAtTime(.0001, t + dec);
    o.connect(env); pan(env, p, sfxBus); o.start(t); o.stop(t + dec + .02);
  }
  function hiss(t, dur, f, g, q = 1.2, p = 0) {
    const s = ac.createBufferSource(); s.buffer = noise;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
    const env = ac.createGain(); env.gain.setValueAtTime(.0001, t); env.gain.exponentialRampToValueAtTime(g, t + .004); env.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(bp); bp.connect(env); pan(env, p, sfxBus); s.start(t, R() * 1.5); s.stop(t + dur + .02);
  }
  function thump(t, g = .25, f0 = 150, f1 = 70, dec = .18) {
    const o = ac.createOscillator(); o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dec);
    const env = ac.createGain(); env.gain.setValueAtTime(.0001, t); env.gain.exponentialRampToValueAtTime(g, t + .005); env.gain.exponentialRampToValueAtTime(.0001, t + dec);
    o.connect(env); env.connect(sfxBus); o.start(t); o.stop(t + dec + .02);
  }
  const clack = (t, p = 0) => { hiss(t, .06, 2300, .12, 1.6, p); thump(t, .11, 170, 90, .12); };
  const boom = (t, g = .32) => thump(t, g * .5, 95, 38, 1.6);
  function riser(t0, t1, f0, f1, g = .05) {
    const s = ac.createBufferSource(); s.buffer = noise; s.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2; bp.frequency.setValueAtTime(f0, t0); bp.frequency.exponentialRampToValueAtTime(f1, t1);
    const env = ac.createGain(); env.gain.setValueAtTime(.0001, t0); env.gain.exponentialRampToValueAtTime(g, t1 - .05); env.gain.exponentialRampToValueAtTime(.0001, t1 + .3);
    s.connect(bp); bp.connect(env); env.connect(sfxBus); s.start(t0); s.stop(t1 + .35);
  }
  function beep(f, t, d, g = .03) {
    const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1600;
    const env = ac.createGain(); env.gain.setValueAtTime(.0001, t); env.gain.exponentialRampToValueAtTime(g, t + .01); env.gain.setValueAtTime(g, t + d - .04); env.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(lp); lp.connect(env); env.connect(sfxBus); o.start(t); o.stop(t + d + .02);
  }
  const click = t => { hiss(t, .025, 4200, .08, .8); tick(1500, t, .03, .03); };

  // 和弦（D 大调）
  const D = [
    [0, 5.3, [50, 57, 61, 64, 66]], [5.3, 9.0, [47, 54, 57, 61, 62]], [9.0, 12.6, [43, 50, 54, 59]], [12.6, 16.0, [42, 50, 52, 57]],
    [16.0, 19.5, [45, 52, 57, 62, 64]], [19.5, 25.1, [43, 50, 57, 59, 66]], [25.1, 28.6, [40, 47, 50, 54, 55]], [28.6, 32.1, [47, 54, 57, 62]],
    [32.1, 36.1, [43, 50, 54, 59]], [36.1, 40.2, [47, 54, 59, 62]], [40.2, 43.4, [43, 50, 55, 59]], [43.4, 47.6, [45, 50, 54, 57, 62]],
    [47.6, 51.0, [43, 50, 54, 59]], [51.0, 53.5, [40, 47, 50, 55]], [53.5, 56.1, [50, 57, 59, 64]],
    [56.1, 59.4, [50, 57, 61, 64, 66]], [59.4, 61.6, [47, 54, 57, 62]], [61.6, 63.8, [43, 50, 54, 61]], [63.8, 66.0, [40, 47, 48, 55]],
    [66.0, 67.8, [38, 45]], [67.8, 69.6, [43, 50, 54, 59, 57]], [69.6, 71.5, [50, 57, 62, 66]], [71.5, 73.3, [49, 57, 61, 64]], [73.3, 75.1, [47, 54, 59, 62]],
    [75.1, 80.8, [55, 59, 62, 66, 69]], [80.8, 84.1, [45, 52, 57, 62, 64]], [84.1, DUR - 1.2, [50, 57, 61, 64, 66, 69]]
  ];
  D.forEach(([a, b, ms]) => chord(ms, a, b, a >= 66 && a < 67.8 ? .02 : .014, a >= 75 && a < 81 ? 1500 : 1000));
  // 开场
  bell(81, .35, .035, 2.4, -.3); bell(74, 1.1, .03, 2.4, .2); bell(78, 2.2, .03, 2.4, 0);
  // 时间轨道：每一站一个音，越来越高
  [74, 76, 78, 81, 83, 85, 86].forEach((m, i) => { pluck(m, EVT_T[i], .06, (i - 3) * .15); if (i === 6) { bell(74, EVT_T[i] + .02, .04, 3); boom(EVT_T[i], .28); } });
  riser(19.4, 20.4, 300, 2600, .04); bell(76, 20.35, .045, 2.6);
  [0, 1, 2, 3, 4].forEach(i => tick(1760 + i * 140, 21.9 + i * .2, .02, .08));
  [0, 1, 2, 3, 4].forEach(i => tick(1320, 23.0 + i * .22, .014, .05));
  // 小圆点变蓝：算出每个圆点什么时候变蓝，就在那一刻轻轻响一下
  const lvTime = lv => (lv <= 70 ? lerp(28.4, 30.6, clamp((lv - 40) / 30)) : lerp(31.6, 33.6, clamp((lv - 70) / 30)));
  PEOPLE.forEach((p, i) => p[3].forEach(([, th]) => { if (th > 40 && th <= 100) { const tt = 28.4 + (lvTime(th) - 28.4); tick(1900 + p[2] * 110, tt, .012, .07, i % 2 ? .35 : -.35); } }));
  // 多米诺
  for (let i = 0; i < 8; i++) clack(RUN1 + i * GAP + .4, (i % 4 - 1.5) * .25);
  riser(REW, REW + .8, 2400, 400, .03);
  thump(WALL + .1, .12, 110, 60, .25);
  for (let i = 0; i < 2; i++) clack(RUN2 + i * GAP + .4, (i - 1.5) * .25);
  thump(RUN2 + 2 * GAP + .36, .16, 130, 55, .3); hiss(RUN2 + 2 * GAP + .36, .08, 900, .08, 1);
  [74, 78, 81, 86].forEach((m, i) => bell(m, RUN2 + 2 * GAP + .55 + i * .12, .035, 2.2, (i - 1.5) * .2));
  // 钱：硬币
  for (let tt = 49.0; tt < 55.8; tt += .38) tick(tt < 53.6 ? 2637 : 3136, tt, .008, .09, R() - .5);
  riser(53.3, 54.0, 400, 1800, .03); bell(81, 53.7, .04, 2.2);
  // 四种未来
  FUT_T.forEach(([ft, key]) => {
    if (key !== 'N') { click(ft); click(ft + .12); }
    if (key === 'A') { bell(74, ft + .2, .045, 2.4); bell(78, ft + .32, .04, 2.4); bell(81, ft + .44, .04, 2.4); }
    if (key === 'B') { bell(71, ft + .2, .04, 1.8); bell(74, ft + .5, .035, 1.8); }
    if (key === 'C') bell(73, ft + .25, .04, 2.2);
    if (key === 'D') boom(ft + .1, .26);
    if (key === 'X') { boom(ft, .34); for (let k = 0; k < 3; k++) { beep(660, ft + .2 + k * .5, .2); beep(520, ft + .45 + k * .5, .2); } }
    if (key === 'N') { bell(74, ft + .1, .045, 2.6); bell(81, ft + .3, .04, 2.6); }
  });
  // 各方
  [74, 76, 78, 81, 83].forEach((m, i) => pluck(m, 70.1 + i * .28, .05, (i - 2) * .2));
  // 更远的未来：星光
  for (let tt = 75.6; tt < 80.6; tt += .42) bell([83, 86, 88, 90][Math.floor(R() * 4)], tt, .016, 1.6, R() * 1.2 - .6);
  // 结尾
  bell(74, 81.0, .05, 3); bell(78, 81.8, .045, 3); bell(81, 84.3, .05, 3.2); bell(86, 85.9, .035, 3); boom(84.2, .2);
  const buf = await ac.startRendering();
  // 编码成 16 位 WAV
  const n = buf.length, L = buf.getChannelData(0), Rr = buf.getChannelData(1);
  const ab = new ArrayBuffer(44 + n * 4), dv = new DataView(ab);
  const ws = (o, s) => [...s].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  ws(0, 'RIFF'); dv.setUint32(4, 36 + n * 4, true); ws(8, 'WAVE'); ws(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true);
  dv.setUint32(24, SR, true); dv.setUint32(28, SR * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); ws(36, 'data'); dv.setUint32(40, n * 4, true);
  let o = 44;
  for (let i = 0; i < n; i++) for (const ch of [L, Rr]) { const v = Math.max(-1, Math.min(1, ch[i])); dv.setInt16(o, v < 0 ? v * 32768 : v * 32767, true); o += 2; }
  window.__wav = new Uint8Array(ab);
  return Math.ceil(ab.byteLength / CH);
}
window.audioChunk = i => {
  const u = window.__wav.subarray(i * CH, (i + 1) * CH);
  let s = '';
  for (let j = 0; j < u.length; j += 0x8000) s += String.fromCharCode.apply(null, u.subarray(j, j + 0x8000));
  return btoa(s);
};

/* 先把用到的字都加载好，再开始画 */
window.ready = (async () => {
  const txt = document.getElementById('src').textContent;
  await Promise.all(['400', '700', '900'].flatMap(w => [document.fonts.load(`${w} 40px "Noto Sans SC"`, txt), document.fonts.load(`${w} 40px "Inter"`, txt)])
    .concat(document.fonts.load('700 40px "JetBrains Mono"', txt)));
  await document.fonts.ready;
  seek(0);
  return true;
})();
window.seek = seek;
window.renderAudio = renderAudio;
window.DUR = DUR;
</script>
