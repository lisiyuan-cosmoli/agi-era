<script id="src">
'use strict';
/* 共同未来 · 短片《AGI 时代下，人类如何生活？》
   每一帧都由 seek(t) 画出来；声音由 renderAudio() 离线合成。同样的输入，得到同样的视频。 */
const W = 1080, H = 1920, DUR = 89.5;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

/* ---------- 工具 ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const Ez = {
  io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  out: k => 1 - Math.pow(1 - k, 3),
  in: k => k * k,
  back: k => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); }
};
function vis(t, a, b, fi = .4, fo = .4) {
  if (t < a || t > b) return 0;
  return Math.min(Ez.out(prog(t, a, a + fi)), 1 - Ez.in(prog(t, b - fo, b)));
}
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, k) {
  const A = hex(a), B = hex(b);
  return '#' + A.map((v, i) => Math.round(lerp(v, B[i], clamp(k))).toString(16).padStart(2, '0')).join('');
}
function rgba(h, a) { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${clamp(a)})`; }

const C = {
  ink: '#f1f4fa', dim: '#a7b1c6', faint: '#6f7a92',
  human: '#f0a02e', humanLt: '#ffd27a', winLit: '#ffe2a1', gold: '#ffc94d',
  ai: '#3657ff', aiLt: '#7d95ff', aiInk: '#a2b3ff', aiSoft: '#dbe3ff',
  risk: '#ff7a6a', share: '#3fd09d', gov: '#98a8c6',
  facade: '#1e2638', facade2: '#252e43', fline: '#323d56', roof: '#3a4459', winDark: '#141b2a'
};
const SANS = '"Noto Sans SC","WenQuanYi Zen Hei",sans-serif';
const MONO = '"JetBrains Mono","Noto Sans SC",monospace';
const font = (size, weight = 700, mono = false) => `${weight} ${size}px ${mono ? MONO : SANS}`;

function fill(color, path) { ctx.fillStyle = color; ctx.beginPath(); path(); ctx.fill(); }
function textW(str, f, ls = 0) { ctx.save(); ctx.font = f; ctx.letterSpacing = ls + 'px'; const w = ctx.measureText(str).width; ctx.restore(); return w; }
const segsOf = (line, color) => (typeof line === 'string' ? [[line, color]] : line.map(s => (typeof s === 'string' ? [s, color] : [s[0], s[1] || color])));

/* 一行文字，可以分段上色 */
function line(segs, x, y, f, { color = C.ink, align = 'left', alpha = 1, ls = 0 } = {}) {
  if (alpha <= 0) return;
  segs = segsOf(segs, color);
  ctx.save();
  ctx.font = f; ctx.letterSpacing = ls + 'px'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const ws = segs.map(s => ctx.measureText(s[0]).width), total = ws.reduce((a, b) => a + b, 0);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  ctx.globalAlpha = alpha;
  segs.forEach((s, i) => { ctx.fillStyle = s[1]; ctx.fillText(s[0], cx, y); cx += ws[i]; });
  ctx.restore();
}
/* 逐字出现的标题 */
function reveal(segs, x, y, f, t, t0, { color = C.ink, align = 'left', alpha = 1, stagger = .032, dur = .45, rise = 30, ls = 0 } = {}) {
  if (alpha <= 0 || t < t0) return;
  const chars = [];
  segsOf(segs, color).forEach(([s, c]) => [...s].forEach(ch => chars.push([ch, c])));
  ctx.save();
  ctx.font = f; ctx.letterSpacing = ls + 'px'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const ws = chars.map(([ch]) => ctx.measureText(ch).width), total = ws.reduce((a, b) => a + b, 0);
  let cx = align === 'center' ? x - total / 2 : x;
  chars.forEach(([ch, c], i) => {
    const k = Ez.out(prog(t, t0 + i * stagger, t0 + i * stagger + dur));
    if (k > 0) { ctx.globalAlpha = alpha * k; ctx.fillStyle = c; ctx.fillText(ch, cx, y + (1 - k) * rise); }
    cx += ws[i];
  });
  ctx.restore();
}
/* 底部字幕：几行文字居中，淡入淡出 */
function caption(t, a, b, lines, { y = 1440, size = 46, lh = 68, weight = 700, color = C.ink } = {}) {
  const v = vis(t, a, b, .45, .35);
  if (!v) return;
  const y0 = y - (lines.length - 1) * lh / 2;
  lines.forEach((ln, i) => {
    const k = Ez.out(prog(t, a + i * .1, a + i * .1 + .5));
    line(ln, W / 2, y0 + i * lh + (1 - k) * 16, font(size, weight), { color, align: 'center', alpha: v * k });
  });
}
function pill(x, y, w, h, color) { fill(color, () => ctx.roundRect(x, y, w, h, h / 2)); }
function glowDot(x, y, r, color, blur = 30) { ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = blur; fill(color, () => ctx.arc(x, y, r, 0, 7)); ctx.restore(); }

/* ---------- 夜空 ---------- */
const STARS = (() => { const r = rng(7); return Array.from({ length: 110 }, () => ({ x: r() * W, y: r() * H * .8, s: r() * 1.9 + .5, p: r() * 6.28, f: .5 + r() * 1.3 })); })();
function sky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#080d1d'); g.addColorStop(.55, '#0d1630'); g.addColorStop(1, '#121d3b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const glow = (x, y, r, c) => { const rg = ctx.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, c); rg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = rg; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); };
  glow(W * .92 + Math.sin(t * .13) * 30, H * .8, 820, 'rgba(54,87,255,0.20)');
  glow(W * .05, H * .1 + Math.sin(t * .1) * 40, 700, 'rgba(240,160,46,0.09)');
  for (const s of STARS) {
    ctx.globalAlpha = .25 + .35 * (.5 + .5 * Math.sin(t * s.f + s.p));
    fill('#ffffff', () => ctx.arc(s.x, s.y, s.s, 0, 7));
  }
  ctx.globalAlpha = 1;
}

/* ---------- 楼里的 12 户人家（和网页一致） ---------- */
const K = 999;
const PEOPLE = [
  ['陈工', '程序员', 6, [['写代码', 25], ['写测试', 30], ['查 bug', 38], ['设计整个系统', 65], ['出了事故负责', K]]],
  ['王姐', '护工', 6, [['记录体征', 20], ['提醒吃药', 25], ['应对突发情况', 85], ['翻身、护理', 90], ['陪老人聊天', K]]],
  ['小周', '客服', 5, [['回答常见问题', 8], ['查订单', 15], ['处理投诉', 45], ['安抚情绪', 55], ['特殊情况拍板', 80]]],
  ['大海', '货车司机', 5, [['规划路线', 10], ['高速上开车', 55], ['城市里开车', 70], ['装卸货', 80], ['处理路上的意外', 90]]],
  ['林然', '剪辑师', 4, [['加字幕、配乐', 15], ['挑素材', 25], ['粗剪', 30], ['调色、特效', 35], ['读懂客户要什么', 72]]],
  ['苏老师', '中学老师', 4, [['出题、批改', 20], ['备课', 30], ['答疑', 45], ['管好一个班', 85], ['关心每个学生', K]]],
  ['阿敏', '会计', 3, [['记账', 10], ['报税', 25], ['做报表', 30], ['审核', 50], ['给老板出主意', 75]]],
  ['张哥', '外卖骑手', 3, [['接单、派单', 5], ['规划路线', 10], ['处理差评', 50], ['送餐', 75], ['上楼交到手里', 88]]],
  ['小吴', '研究员', 2, [['查文献', 20], ['分析数据', 30], ['写论文初稿', 40], ['设计实验', 60], ['决定研究什么', 92]]],
  ['小芳', '仓库分拣员', 2, [['扫码登记', 10], ['盘点', 30], ['分拣', 45], ['搬运', 60], ['处理破损件', 85]]],
  ['刘医生', '医生', 1, [['写病历', 20], ['看影像片子', 35], ['辅助诊断', 50], ['定治疗方案', 68], ['陪病人、签字负责', K]]],
  ['老马', '维修师傅', 1, [['报价', 30], ['判断故障', 50], ['上门修理', 92], ['爬高下低', 95], ['和住户沟通', K]]]
];
const unitXY = i => ({ x: i % 2 === 0 ? 36 : 184, y: 52 + (6 - PEOPLE[i][2]) * 52 + 6 });
const taskOn = (th, lv) => (th === K ? 0 : clamp((lv - th + 4) / 4));
const ainess = (p, lv) => clamp((p[3].reduce((a, tk) => a + taskOn(tk[1], lv), 0) - 2.45) / .5);
const flickAt = (i, t) => ([2, 5, 6, 9].includes(i) && Math.floor(t * 2.2 + i * .77) % 3 === 0 ? 1 : 0);

/* 画一栋楼（楼内坐标 360×430，和网页一样） */
function building(o) {
  const { x, y, s, alpha = 1 } = o;
  if (alpha <= .002) return;
  const fx = o.fx || {};
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.globalAlpha = alpha;
  if (fx.off) ctx.filter = `grayscale(${(fx.off * .95).toFixed(3)}) brightness(${(1 - fx.off * .3).toFixed(3)})`;
  roofFx(o, fx);
  fill(C.roof, () => ctx.roundRect(16, 44, 328, 8, 3));
  fill(C.facade, () => ctx.rect(24, 52, 312, 312));
  ctx.strokeStyle = C.fline; ctx.lineWidth = 2;
  for (let f = 1; f < 6; f++) { ctx.beginPath(); ctx.moveTo(24, 52 + f * 52); ctx.lineTo(336, 52 + f * 52); ctx.stroke(); }
  PEOPLE.forEach((p, i) => unit(o, fx, p, i));
  fill(C.facade2, () => ctx.rect(24, 364, 312, 52));
  shop(o, fx);
  fill(C.facade, () => ctx.roundRect(262, 376, 44, 40, 3));
  fill(C.fline, () => ctx.roundRect(8, 416, 344, 8, 2));
  bodyFx(o, fx);
  if (fx.alarm) {
    const t = o.t || 0;
    ctx.filter = 'none';
    ctx.globalAlpha = alpha * fx.alarm * (Math.floor(t * 2) % 2 ? .35 : 1);
    glowDot(180, 26, 11, C.risk, 24);
    ctx.fillStyle = C.risk; ctx.font = font(13, 900); ctx.textAlign = 'left'; ctx.fillText('系统失灵', 200, 31);
  }
  ctx.restore();
}
function unit(o, fx, p, i) {
  const { lv = 0, labels = 0, t = 0, alpha = 1, hl } = o;
  const { x, y } = unitXY(i);
  const ai = ainess(p, lv);
  const dark = Math.max(fx.dark ? (fx.dark[i] || 0) : 0, fx.flick ? fx.flick * flickAt(i, t) : 0);
  const gold = fx.gold ? (fx.gold[i] || 0) : 0;
  let col = mix(C.winLit, C.aiSoft, ai);
  col = mix(col, C.gold, gold);
  col = mix(col, C.winDark, dark);
  ctx.save();
  ctx.shadowColor = gold > .5 ? rgba('#ffc94d', .9 * (1 - dark * .5)) : ai > .5 ? rgba('#7d95ff', .8 * (1 - dark)) : rgba('#ffc46e', .6 * (1 - dark));
  ctx.shadowBlur = 30 + gold * 20;
  fill(col, () => ctx.roundRect(x, y, 140, 40, 6));
  ctx.restore();
  // 窗户变蓝的一瞬间，外面闪一圈
  const ring = 4 * ai * (1 - ai);
  if (ring > .02) { ctx.save(); ctx.globalAlpha = alpha * ring; ctx.strokeStyle = C.aiLt; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.roundRect(x - 4 - ring * 3, y - 4 - ring * 3, 148 + ring * 6, 48 + ring * 6, 9); ctx.stroke(); ctx.restore(); }
  if (hl && hl[i]) { ctx.save(); ctx.globalAlpha = alpha * hl[i]; ctx.strokeStyle = C.humanLt; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(x - 4, y - 4, 148, 48, 9); ctx.stroke(); ctx.restore(); }
  const ink = mix(mix('#2b2418', '#1c2a6b', ai), '#46506a', dark);
  if (labels < 1) {
    ctx.save(); ctx.globalAlpha = alpha * (1 - labels) * .5 * (1 - dark * .5); ctx.fillStyle = ink;
    ctx.beginPath(); ctx.arc(x + 70, y + 14, 6, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x + 62, y + 22, 16, 18, 7); ctx.fill();
    ctx.restore();
  }
  if (labels > 0) {
    ctx.save();
    ctx.globalAlpha = alpha * labels;
    ctx.fillStyle = ink; ctx.textAlign = 'left';
    ctx.font = font(15, 900); ctx.fillText(p[0], x + 9, y + 18);
    const nw = ctx.measureText(p[0]).width;
    ctx.font = font(12.5, 400); ctx.globalAlpha = alpha * labels * .85; ctx.fillText(p[1], x + 9 + nw + 6, y + 18);
    ctx.globalAlpha = alpha * labels;
    p[3].forEach((tk, k) => {
      const cx = x + 16 + k * 15, cy = y + 30;
      if (tk[1] === K) {
        ctx.setLineDash([2.2, 2]); ctx.strokeStyle = mix('#c97c10', '#46506a', dark); ctx.lineWidth = 1.7;
        ctx.beginPath(); ctx.arc(cx, cy, 4.4, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      } else {
        const on = taskOn(tk[1], lv), pop = 4 * on * (1 - on);
        fill(mix(mix('#e8940f', C.ai, on), '#46506a', dark), () => ctx.arc(cx, cy, 4.6 * (1 + pop * .45), 0, 7));
      }
    });
    ctx.restore();
  }
}
function shop(o, fx) {
  const dark = fx.shopDark || 0;
  ctx.save();
  ctx.shadowColor = rgba('#ffb45a', .6 * (1 - dark)); ctx.shadowBlur = 26;
  fill(mix('#ffd9a8', C.winDark, dark), () => ctx.roundRect(38, 380, 204, 32, 4));
  ctx.restore();
  for (let k = 0; k < 8; k++) {
    const x0 = 34 + k * 27;
    ctx.beginPath(); ctx.moveTo(x0, 366); ctx.lineTo(x0 + 27, 366); ctx.lineTo(x0 + 27, 376); ctx.quadraticCurveTo(x0 + 13.5, 383, x0, 376); ctx.closePath();
    ctx.fillStyle = k % 2 ? mix('#f1f4fa', '#5b6377', dark) : mix(C.risk, '#5a3b3b', dark); ctx.fill();
  }
  ctx.fillStyle = mix('#2b2418', '#8b95a7', dark); ctx.font = font(12.5, 900); ctx.textAlign = 'center';
  ctx.fillText(dark > .5 ? '楼下小馆' : '楼下小馆 · 营业中', 140, 401);
}
function roofFx(o, fx) {
  const t = o.t || 0;
  if (fx.garden) {
    ctx.save(); ctx.globalAlpha *= fx.garden;
    [[66, 22], [100, 18], [260, 20], [294, 24]].forEach(([x, y], k) => {
      const sway = Math.sin(t * 1.3 + k) * 1.2;
      fill('#5a4a32', () => ctx.rect(x - 2, y + 6, 4, 44 - y - 6));
      fill(C.share, () => ctx.arc(x + sway, y, 10, 0, 7));
    });
    [[160, 36], [182, 34], [202, 37]].forEach(([x, y]) => {
      fill('#cfd6e6', () => ctx.arc(x, y - 7, 3.5, 0, 7));
      fill('#cfd6e6', () => ctx.roundRect(x - 3.5, y - 3, 7, 10, 3));
    });
    ctx.restore();
  }
  if (fx.platform) {
    ctx.save(); ctx.globalAlpha *= fx.platform;
    ctx.shadowColor = rgba(C.aiLt, .8); ctx.shadowBlur = 20;
    fill(C.ai, () => ctx.roundRect(100, 4, 160, 30, 8));
    ctx.shadowBlur = 0;
    fill(C.ai, () => ctx.rect(172, 34, 16, 10));
    ctx.fillStyle = '#fff'; ctx.font = font(13.5, 900); ctx.textAlign = 'center'; ctx.fillText('大平台 · 规则由我定', 180, 24.5);
    ctx.restore();
  }
  if (fx.pent) {
    ctx.save(); ctx.globalAlpha *= fx.pent;
    ctx.shadowColor = rgba(C.gold, .9); ctx.shadowBlur = 26;
    fill(C.gold, () => ctx.roundRect(120, 6, 120, 38, 6));
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#3a2a00'; ctx.font = font(12.5, 900); ctx.textAlign = 'center'; ctx.fillText('少数人的顶层', 180, 30);
    ctx.restore();
  }
}
function bodyFx(o, fx) {
  if (fx.scaffold) {
    ctx.save(); ctx.globalAlpha *= fx.scaffold;
    ctx.strokeStyle = '#d1913a'; ctx.lineWidth = 2;
    [30, 330].forEach(x => { ctx.beginPath(); ctx.moveTo(x, 100); ctx.lineTo(x, 340); ctx.stroke(); });
    [104, 156, 208, 260, 312].forEach(y => { ctx.beginPath(); ctx.moveTo(22, y); ctx.lineTo(338, y); ctx.stroke(); });
    fill('#f1f4fa', () => ctx.roundRect(128, 170, 104, 24, 6));
    ctx.fillStyle = '#141a24'; ctx.font = font(12, 900); ctx.textAlign = 'center'; ctx.fillText('修修补补中', 180, 186.5);
    ctx.restore();
  }
  if (fx.platform) {
    ctx.save(); ctx.globalAlpha *= fx.platform * .9;
    ctx.strokeStyle = C.aiLt; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
    [80, 132, 184, 236, 288].forEach((y, k) => { ctx.beginPath(); ctx.moveTo(180, 44); ctx.lineTo(k % 2 ? 254 : 106, y); ctx.stroke(); });
    ctx.restore();
  }
  if (fx.crack) {
    ctx.save(); ctx.globalAlpha *= Math.min(1, fx.crack * 2);
    const pts = [[180, 52], [172, 100], [186, 150], [174, 200], [188, 250], [176, 300], [186, 340], [180, 364]];
    const len = 330;
    ctx.strokeStyle = C.risk; ctx.lineWidth = 3.2; ctx.lineJoin = 'round';
    ctx.shadowColor = rgba(C.risk, .8); ctx.shadowBlur = 12;
    ctx.setLineDash([len * clamp(fx.crack), len]);
    ctx.beginPath(); pts.forEach(([x, y], k) => (k ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
    ctx.restore();
  }
  if (fx.closed) {
    ctx.save(); ctx.globalAlpha *= fx.closed;
    fill('#0b1120', () => ctx.roundRect(84, 386, 112, 20, 4));
    ctx.fillStyle = '#eef1f6'; ctx.font = font(12, 900); ctx.textAlign = 'center'; ctx.fillText('暂停营业', 140, 400.5);
    ctx.restore();
  }
}

/* ---------- 楼在整部片子里的位置：[时间, 中心 x, 顶部 y, 缩放, 透明度, 名字和圆点] ---------- */
const BK = [
  [0, 540, 740, 1.8, 1, 0], [5.0, 540, 740, 1.8, 1, 0], [5.9, 540, 650, 1.3, 1, 0],
  [19.5, 540, 650, 1.3, 1, 0], [20.3, 540, 660, 1.3, .3, 0], [25.0, 540, 660, 1.3, .3, 0],
  [26.1, 540, 440, 2.2, 1, 1], [35.7, 540, 440, 2.2, 1, 1], [36.5, 540, 420, 2.0, 0, 1],
  [55.9, 540, 700, 1.5, 0, 0], [56.8, 540, 690, 1.5, 1, 0], [69.2, 540, 690, 1.5, 1, 0],
  [69.9, 540, 660, 1.4, 0, 0], [83.9, 540, 470, 1.0, 0, 0], [84.7, 540, 470, 1.0, 1, 0], [DUR + 1, 540, 470, 1.0, 1, 0]
];
function bAt(t) {
  let i = 0;
  while (i < BK.length - 2 && t > BK[i + 1][0]) i++;
  const a = BK[i], b = BK[i + 1], k = Ez.io(prog(t, a[0], b[0]));
  const v = j => lerp(a[j], b[j], k);
  const s = v(3);
  return { x: v(1) - 180 * s, y: v(2), s, alpha: v(4), labels: v(5) };
}
const EVT = [
  [2012, 'AI 学会“看图”', '能从照片里认出猫和狗。'],
  [2016, '下围棋赢了世界冠军', '靠“感觉”的事，AI 也能赢过人。'],
  [2020, '写出像人写的文章', '给它开个头，它就能接着往下写。'],
  [2022, '会聊天的 AI 来了', '很快就有上亿人用上了它。'],
  [2024, '一句话生成视频', '光影和镜头，像真的拍出来的。'],
  [2025, '数学奥赛拿到金牌水平', '也开始自己写代码、操作电脑。'],
  [2026, 'AI 独立解开 80 年前的数学难题', '它自己找到了埃尔德什 1946 年一个猜想的反例。']
];
const EVT_T = [5.7, 7.6, 9.4, 11.0, 12.5, 13.9, 15.3];
function yearAt(t) {
  if (t <= EVT_T[0]) return 2012;
  for (let i = 0; i < EVT_T.length - 1; i++) if (t < EVT_T[i + 1]) return lerp(EVT[i][0], EVT[i + 1][0], Ez.io(prog(t, EVT_T[i + 1] - .9, EVT_T[i + 1])));
  return 2026;
}

    [0, 5.3, [50, 57, 61, 64, 66]], [5.3, 9.0, [47, 54, 57, 61, 62]], [9.0, 12.6, [43, 50, 54, 59]], [12.6, 16.0, [42, 50, 52, 57]],

    [32.1, 36.1, [43, 50, 54, 59]], [36.1, 40.2, [47, 54, 59, 62]], [40.2, 43.4, [43, 50, 55, 59]], [43.4, 47.6, [45, 50, 54, 57, 62]],
    [47.6, 51.0, [43, 50, 54, 59]], [51.0, 53.5, [40, 47, 50, 55]], [53.5, 56.1, [50, 57, 59, 64]],

    [75.1, 80.8, [55, 59, 62, 66, 69]], [80.8, 84.1, [45, 52, 57, 62, 64]], [84.1, DUR - 1.2, [50, 57, 61, 64, 66, 69]]

  riser(19.4, 20.4, 300, 2600, .04); bell(76, 20.35, .045, 2.6);
  [0, 1, 2, 3, 4].forEach(i => tick(1760 + i * 140, 21.9 + i * .2, .02, .08));

  const lvTime = lv => (lv <= 70 ? lerp(28.4, 30.6, clamp((lv - 40) / 30)) : lerp(31.6, 33.6, clamp((lv - 70) / 30)));
  PEOPLE.forEach((p, i) => p[3].forEach(([, th]) => { if (th > 40 && th <= 100) { const tt = 28.4 + (lvTime(th) - 28.4); tick(1900 + p[2] * 110, tt, .012, .07, i % 2 ? .35 : -.35); } }));

  // 钱：硬币
  for (let tt = 49.0; tt < 55.8; tt += .38) tick(tt < 53.6 ? 2637 : 3136, tt, .008, .09, R() - .5);

  [74, 76, 78, 81, 83].forEach((m, i) => pluck(m, 70.1 + i * .28, .05, (i - 2) * .2));
  // 更远的未来：星光
  for (let tt = 75.6; tt < 80.6; tt += .42) bell([83, 86, 88, 90][Math.floor(R() * 4)], tt, .016, 1.6, R() * 1.2 - .6);

  const buf = await ac.startRendering();

  dv.setUint32(24, SR, true); dv.setUint32(28, SR * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); ws(36, 'data'); dv.setUint32(40, n * 4, true);

window.audioChunk = i => {
